name: '🚀 CodeSweep · $(Build.BuildId)'

trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: github
      name: YelcoBot/azure-devops-core
      ref: refs/heads/main
      endpoint: YelcoBotCompany # Service connection de GitHub en Azure DevOps

pool:
  name: SelfHosted

variables:
  - group: CodeSweep

stages:
  # Pull Request: build + tests
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - template: main.yml@templates
      parameters:
        service: code-analysis
        language: netframework
        command: test

  # Push: empaqueta y despliega el VSIX (Marketplace para VS, GitHub Release para SSMS)
  - ${{ else }}:
    - template: main.yml@templates
      parameters:
        service: visual-studio-marketplace
        language: netframework
        command: deploy
        projects:
          - name: CodeSweep
            type: VSIX
            projectPattern: '**\YelcoBot.CodeSweep.csproj'
            outputPath: ''
            vsixFile: 'YelcoBot.CodeSweep.vsix'
            publisherId: 'yelcobot'
        artifacts:
          - name: CodeSweep
            path: ''

    - template: main.yml@templates
      parameters:
        service: github-release
        language: netframework
        command: deploy
        dependsOn: []
        projects:
          - name: CodeSweep
            type: VSIX
            projectPattern: '**\YelcoBot.CodeSweep.csproj'
            outputPath: ''
        artifacts:
          - name: CodeSweep-GitHub
            path: ''
