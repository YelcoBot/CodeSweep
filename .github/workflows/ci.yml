name: CI Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore CodeSweep.slnx

    - name: Build Solution
      run: msbuild CodeSweep.slnx /p:Configuration=Release

    - name: Run Tests
      run: dotnet test CodeSweep.slnx --configuration Release --no-build --verbosity normal

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeSweep-VSIX
        path: src/YelcoBot.CodeSweep/bin/Release/*.vsix
