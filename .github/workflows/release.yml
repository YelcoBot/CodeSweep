name: Release to VS Marketplace

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore CodeSweep.slnx

    - name: Build Release
      run: msbuild CodeSweep.slnx /p:Configuration=Release

    - name: Run Tests
      run: dotnet test CodeSweep.slnx --configuration Release --no-build

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: src/YelcoBot.CodeSweep/bin/Release/*.vsix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
